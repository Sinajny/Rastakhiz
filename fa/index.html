<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>رستاخیز | Rastakhiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --iran-green: #1F5A45;
      --iran-red: #A6292E;
      --sun-gold: #C6A15B;
      --ivory: #F7F5EF;
      --text: #202020;
      --muted: #66645F;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Vazirmatn", sans-serif;
      background: var(--ivory);
      color: var(--text);
    }

    .language-page {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;

      position: relative;
      overflow: hidden;
    }

    /* خط هویتی ایران */
    .identity-line {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 5px;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    .identity-line .green {
      background: var(--iran-green);
    }

    .identity-line .white {
      background: #FFFFFF;
    }

    .identity-line .red {
      background: var(--iran-red);
    }

    .content {
      width: 100%;
      max-width: 700px;

      text-align: center;
    }

    .symbol {
      color: var(--sun-gold);

      font-size: 42px;
      line-height: 1;

      margin-bottom: 25px;
    }

    .brand {
      margin: 0;

      color: var(--iran-green);

      font-size: clamp(46px, 9vw, 78px);
      font-weight: 800;

      letter-spacing: -2px;
    }

    .brand-en {
      margin-top: 5px;

      color: var(--muted);

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;

      letter-spacing: 5px;
    }

    .gold-line {
      width: 55px;
      height: 2px;

      margin: 30px auto;

      background: var(--sun-gold);
    }

    .select-text {
      margin-bottom: 28px;

      color: var(--muted);

      font-size: 14px;
      font-weight: 400;
    }

    .languages {
      display: flex;
      justify-content: center;
      align-items: stretch;

      gap: 14px;
    }

    .language {
      width: 180px;

      padding: 17px 20px;

      border: 1px solid rgba(31, 90, 69, 0.28);
      border-radius: 12px;

      background: transparent;

      color: var(--iran-green);

      text-decoration: none;

      font-size: 17px;
      font-weight: 600;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .language:hover {
      background: var(--iran-green);
      color: #FFFFFF;

      border-color: var(--iran-green);

      transform: translateY(-2px);
    }

    .language.fa {
      direction: rtl;
    }

    .language.en,
    .language.de {
      font-family: Arial, sans-serif;
    }

    .footer-mark {
      position: absolute;
      bottom: 24px;

      color: var(--muted);

      font-family: Arial, sans-serif;
      font-size: 10px;

      letter-spacing: 3px;

      opacity: 0.65;
    }

    @media (max-width: 650px) {

      .languages {
        flex-direction: column;
        align-items: center;

        gap: 11px;
      }

      .language {
        width: min(100%, 300px);
      }

      .brand {
        letter-spacing: -1px;
      }

      .symbol {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <main class="language-page">

    <div class="identity-line">
      <div class="green"></div>
      <div class="white"></div>
      <div class="red"></div>
    </div>

    <div class="content">

      <div class="symbol">☀</div>

      <h1 class="brand">رستاخیز</h1>

      <div class="brand-en">
        RASTAKHIZ
      </div>

      <div class="gold-line"></div>

      <div class="select-text">
        زبان را انتخاب کنید
      </div>

      <div class="languages">

        <a
          class="language fa"
          href="fa/"
          lang="fa"
        >
          فارسی
        </a>

        <a
          class="language en"
          href="en/"
          lang="en"
        >
          English
        </a>

        <a
          class="language de"
          href="de/"
          lang="de"
        >
          Deutsch
        </a>

      </div>

    </div>

    <div class="footer-mark">
      RASTAKHIZ.CH
    </div>

  </main>

</body>
</html>
