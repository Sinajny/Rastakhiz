<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رستاخیز | Rastakhiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --green:#1F5A45;
  --red:#A6292E;
  --gold:#C6A15B;
  --ivory:#F7F5EF;
  --text:#202020;
  --muted:#6A6965;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--ivory);
  color:var(--text);
}

.page{
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px 20px;
  position:relative;
}

/* Iranian identity line */

.iran-line{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:5px;

  display:grid;
  grid-template-columns:1fr 1fr 1fr;
}

.green{background:var(--green);}
.white{background:#fff;}
.red{background:var(--red);}

.content{
  width:100%;
  max-width:700px;
  text-align:center;
}

.sun{
  color:var(--gold);
  font-size:42px;
  margin-bottom:22px;
}

h1{
  margin:0;
  color:var(--green);

  font-size:clamp(48px,9vw,78px);
  font-weight:800;
}

.english-name{
  margin-top:5px;

  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:5px;

  color:var(--muted);
}

.gold-line{
  width:55px;
  height:2px;
  background:var(--gold);

  margin:30px auto;
}

.question{
  color:var(--muted);
  font-size:15px;
  margin-bottom:26px;
}

.languages{
  display:flex;
  justify-content:center;
  gap:14px;
}

.language{
  width:180px;
  padding:16px 20px;

  border:1px solid rgba(31,90,69,.30);
  border-radius:12px;

  color:var(--green);
  background:transparent;

  text-decoration:none;
  font-size:17px;
  font-weight:600;

  transition:.2s ease;
}

.language:hover{
  background:var(--green);
  border-color:var(--green);
  color:white;
  transform:translateY(-2px);
}

.footer{
  position:absolute;
  bottom:24px;

  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:3px;

  color:var(--muted);
  opacity:.65;
}

@media(max-width:650px){

  .languages{
    flex-direction:column;
    align-items:center;
  }

  .language{
    width:min(100%,300px);
  }

}

</style>
</head>

<body>

<main class="page">

  <div class="iran-line">
    <div class="green"></div>
    <div class="white"></div>
    <div class="red"></div>
  </div>

  <div class="content">

    <div class="sun">☀</div>

    <h1>رستاخیز</h1>

    <div class="english-name">
      RASTAKHIZ
    </div>

    <div class="gold-line"></div>

    <div class="question">
      زبان را انتخاب کنید
    </div>

    <div class="languages">

      <a class="language" href="fa/">
        فارسی
      </a>

      <a class="language" href="en/">
        English
      </a>

      <a class="language" href="de/">
        Deutsch
      </a>

    </div>

  </div>

  <div class="footer">
    RASTAKHIZ.CH
  </div>

</main>

</body>
</html>
