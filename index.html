<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رستاخیز ۲ ملت ایران</title>
<meta name="description" content="رستاخیز؛ آرشیو حافظه ملی ایران.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F3F3F3;
  --text:#202020;
  --muted:#666666;
  --walnut:#6E4B2A;
  --gold:#B08D57;
  --card:#FFFFFF;
  --line:#DDD8CF;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--text);
}

body::before{
  content:"";
  position:fixed;
  inset:-18px;
  background:
    linear-gradient(rgba(20,14,10,.38),rgba(20,14,10,.48)),
    url('5931479247895597392.jpg') center center / cover no-repeat;
  filter:blur(3px);
  transform:scale(1.035);
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(35,24,16,.12);
  z-index:-1;
  pointer-events:none;
}

.language-page{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:40px 22px;
  overflow:hidden;
}

.language-page::before{
  content:"";
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(176,141,87,.20) 0%,rgba(176,141,87,.07) 40%,rgba(0,0,0,0) 72%);
  pointer-events:none;
}

.content{
  position:relative;
  z-index:1;
  width:100%;
  max-width:720px;
  text-align:center;
}

.brand{
  margin:0;
  color:#F7F5EF;
  text-shadow:0 2px 18px rgba(0,0,0,.28);
  font-size:clamp(34px,7vw,68px);
  font-weight:800;
  line-height:1.2;
}

.brand-en{
  margin-top:8px;
  color:rgba(176,141,87,.58);
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:6px;
  direction:ltr;
}

.divider{
  width:52px;
  height:1px;
  background:var(--gold);
  margin:32px auto 28px;
}

.prompt{
  margin:0 0 25px;
  color:#F3EEE5;
  text-shadow:0 1px 10px rgba(0,0,0,.35);
  font-size:15px;
  font-weight:400;
}

.languages{
  display:flex;
  justify-content:center;
  gap:12px;
  direction:ltr;
}

.language{
  width:170px;
  padding:15px 18px;
  border:1px solid rgba(247,245,239,.52);
  border-radius:14px;
  background:rgba(25,18,12,.28);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#F7F5EF;
  text-decoration:none;
  font-size:16px;
  font-weight:600;
  transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}

.language:hover,
.language:focus-visible{
  background:var(--walnut);
  color:#fff;
  border-color:var(--walnut);
  transform:translateY(-2px);
  outline:none;
}

.language.fa{
  direction:rtl;
}

.language.en,
.language.de{
  direction:ltr;
  font-family:Arial,sans-serif;
}

.site-mark{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  color:#F7F5EF;
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:3px;
  direction:ltr;
  opacity:.65;
}

@media(max-width:620px){
  .languages{
    flex-direction:column;
    align-items:center;
  }

  .language{
    width:min(100%,300px);
  }

  .language-page::before{
    width:390px;
    height:390px;
  }
}
</style>
</head>

<body>
<main class="language-page">
  <div class="content">
    <h1 class="brand">رستاخیز ۲ ملت ایران</h1>
    <div class="brand-en">رستاخیز II</div>
    <div class="divider"></div>

    <p class="prompt">زبان را انتخاب کنید</p>

    <nav class="languages" aria-label="Language selection">
      <a class="language fa" href="fa/" lang="fa">فارسی</a>
      <a class="language en" href="en/" lang="en">English</a>
      <a class="language de" href="de/" lang="de">Deutsch</a>
    </nav>
  </div>

  <div class="site-mark">RASTAKHIZ.CH</div>
</main>
<style>.rz-home-link{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9999;display:flex;gap:8px;align-items:center;background:#fff;color:#6E4B2A!important;border:1px solid #B08D57;border-radius:999px;padding:10px 15px;font:600 14px Vazirmatn,Arial,sans-serif;text-decoration:none!important;box-shadow:0 4px 18px #0002}.rz-home-link svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><a class="rz-home-link" href="/fa/index.html" aria-label="خانه"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg>خانه</a></body>
</html>
