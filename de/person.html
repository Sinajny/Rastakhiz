<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rastakhiz</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#F3F3F3;--text:#202020;--muted:#666;--walnut:#6E4B2A;--gold:#B08D57;--card:#fff;--line:#DDD8CF}*{box-sizing:border-box}body{margin:0;font-family:'Vazirmatn',Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{width:min(1100px,92%);margin:auto;padding:44px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}.brand{color:var(--walnut);font-weight:800;font-size:28px}.back{color:var(--walnut);text-decoration:none}.title{font-size:clamp(28px,5vw,48px);margin:10px 0 8px;color:var(--walnut)}.sub{color:var(--muted);margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.person{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--text);text-decoration:none;transition:.2s}.person:hover{transform:translateY(-2px);border-color:var(--gold)}.name{font-size:18px;font-weight:700}.id{font:11px Arial,sans-serif;color:var(--muted);margin-top:6px;direction:ltr}.profile{max-width:760px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(28px,6vw,60px);text-align:center}.profile h1{font-size:clamp(34px,7vw,60px);color:var(--walnut);margin:0 0 12px}.label{color:var(--gold);font-weight:600}.placeholder{margin-top:38px;padding-top:25px;border-top:1px solid var(--line);color:var(--muted)}</style></head><body><main class="wrap"><a class="back" href="javidnaman.html">Zurück</a><article class="profile"><div class="label">Kind Irans und Märtyrer des Vaterlandes</div><h1 id="name"></h1><div class="id" id="pid"></div><div class="placeholder">Dieses Profil wird vervollständigt.</div></article></main><script src="../people-data.js"></script><script>const id=new URLSearchParams(location.search).get('id');const p=window.RASTAKHIZ_PEOPLE.find(x=>x.id===id);if(p){document.getElementById('name').textContent=p.name+' '+p.family;document.getElementById('pid').textContent='ID '+p.id;document.title=p.name+' '+p.family+' | Rastakhiz'}else{document.getElementById('name').textContent='—';}</script></body></html>
