<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kind Irans und Märtyrer des Vaterlandes | Rastakhiz II der iranischen Nation</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#F3F3F3;--text:#202020;--muted:#666;--walnut:#6E4B2A;--gold:#B08D57;--card:#fff;--line:#DDD8CF}*{box-sizing:border-box}body{margin:0;font-family:'Vazirmatn',Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{width:min(1100px,92%);margin:auto;padding:44px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}.brand{color:var(--walnut);font-weight:800;font-size:28px}.back{color:var(--walnut);text-decoration:none}.title{font-size:clamp(28px,5vw,48px);margin:10px 0 8px;color:var(--walnut)}.sub{color:var(--muted);margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.person{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--text);text-decoration:none;transition:.2s}.person:hover{transform:translateY(-2px);border-color:var(--gold)}.name{font-size:18px;font-weight:700}.id{font:11px Arial,sans-serif;color:var(--muted);margin-top:6px;direction:ltr}.profile{max-width:760px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(28px,6vw,60px);text-align:center}.profile h1{font-size:clamp(34px,7vw,60px);color:var(--walnut);margin:0 0 12px}.label{color:var(--gold);font-weight:600}.placeholder{margin-top:38px;padding-top:25px;border-top:1px solid var(--line);color:var(--muted)}.top .brand{font-size:clamp(16px,3.5vw,28px);line-height:1.35;max-width:72%}</style></head><body><main class="wrap"><div class="top"><div class="brand">Rastakhiz II der iranischen Nation</div><a class="back" href="index.html">Zurück</a></div><h1 class="title">Kind Irans und Märtyrer des Vaterlandes</h1><p class="sub">Gedenkarchiv — <span id="count"></span></p><section class="grid" id="grid"></section></main><script src="../people-data.js"></script><script>const p=window.RASTAKHIZ_PEOPLE;document.getElementById('count').textContent=p.length;document.getElementById('grid').innerHTML=p.map(x=>`<a class="person" href="child-of-iran-martyr-for-the-homeland/${x.slug}/"><div class="name">${(x.nameLatin || x.slug.replace(/-/g,' ').replace(/\b[a-z]/g,c=>c.toUpperCase()))}</div></a>`).join('');</script><style>.rz-home-link{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9999;display:flex;gap:8px;align-items:center;background:#fff;color:#6E4B2A!important;border:1px solid #B08D57;border-radius:999px;padding:10px 15px;font:600 14px Vazirmatn,Arial,sans-serif;text-decoration:none!important;box-shadow:0 4px 18px #0002}.rz-home-link svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><a class="rz-home-link" href="/de/index.html" aria-label="Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg>Startseite</a></body></html>
